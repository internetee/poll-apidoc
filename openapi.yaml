components:
  schemas:
    EppPollRequest:
      type: object
      description: EPP poll command request
      xml:
        name: epp
        namespace: https://epp.tld.ee/schema/epp-ee-1.0.xsd
      properties:
        command:
          type: object
          properties:
            poll:
              type: object
              properties:
                op:
                  type: string
                  enum: [req, ack]
                  xml:
                    attribute: true
                msgID:
                  type: string
                  xml:
                    attribute: true
                  description: Required when op is ack
              required:
                - op
            clTRID:
              type: string
          required:
            - poll
            - clTRID
      required:
        - command

    EppResult:
      type: object
      properties:
        code:
          type: string
          xml:
            attribute: true
        msg:
          type: string

    EppTrID:
      type: object
      properties:
        clTRID:
          type: string
        svTRID:
          type: string

    EppMsgQ:
      type: object
      properties:
        count:
          type: string
          xml:
            attribute: true
        id:
          type: string
          xml:
            attribute: true
        qDate:
          type: string
          format: date-time
        msg:
          type: string

    EppPollEmptyResponse:
      type: object
      description: EPP response when poll queue is empty (result code 1300)
      xml:
        name: epp
        namespace: https://epp.tld.ee/schema/epp-ee-1.0.xsd
      properties:
        response:
          type: object
          properties:
            result:
              $ref: '#/components/schemas/EppResult'
            trID:
              $ref: '#/components/schemas/EppTrID'
          required:
            - result
            - trID
      required:
        - response

    EppPollAckResponse:
      type: object
      description: EPP response for successful poll acknowledge (result code 1000)
      xml:
        name: epp
        namespace: https://epp.tld.ee/schema/epp-ee-1.0.xsd
      properties:
        response:
          type: object
          properties:
            result:
              $ref: '#/components/schemas/EppResult'
            msgQ:
              $ref: '#/components/schemas/EppMsgQ'
            trID:
              $ref: '#/components/schemas/EppTrID'
          required:
            - result
            - trID
      required:
        - response

    EppPollMessageResponse:
      type: object
      description: EPP poll message response (result code 1301)
      xml:
        name: epp
        namespace: https://epp.tld.ee/schema/epp-ee-1.0.xsd
      properties:
        response:
          type: object
          properties:
            result:
              $ref: '#/components/schemas/EppResult'
            msgQ:
              $ref: '#/components/schemas/EppMsgQ'
            resData:
              type: object
              description: Optional response data
            extension:
              type: object
              description: Optional extension data
            trID:
              $ref: '#/components/schemas/EppTrID'
          required:
            - result
            - msgQ
            - trID
      required:
        - response
