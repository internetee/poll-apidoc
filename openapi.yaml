components:
  schemas:
    AutoRenewCycle:
      type: object
      required: [id, state, original_expire_time, expire_time, cancellation_deadline, attempts]
      properties:
        id:
          type: string
          format: uuid
          description: Public cycle UUID used for reversal and idempotency.
        state:
          type: string
          enum: [fundingRetry, autoRenewPeriod, completed, reversed, fundingFailed, cancelled]
        original_expire_time:
          type: string
          format: date-time
        expire_time:
          type: string
          format: date-time
          nullable: true
          description: Expiry applied by automatic renewal; null until renewal succeeds. Retained after reversal.
        cancellation_deadline:
          type: string
          format: date-time
          description: Original expiry plus 15 calendar days in Europe/Tallinn; a new reversal must precede this timestamp.
        attempts:
          type: integer
          minimum: 0
          description: Number of renewal attempts.

    AutoRenewPollData:
      type: object
      required: [event, domain, cycle]
      properties:
        event:
          type: string
          enum: [renewed, fundingWarning, renewProhibited, fundingFailed]
        domain:
          type: string
          example: example.ee
        cycle:
          $ref: '#/components/schemas/AutoRenewCycle'

    ReppAutoRenewPollMessage:
      type: object
      description: REPP notification response; the registrar summary uses the same attachment fields.
      required: [code, message, data]
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
        data:
          type: object
          required: [id, text, attached_obj_type, attached_obj_id, attached_obj_data]
          properties:
            id:
              type: integer
              description: Notification ID used for acknowledgement.
            text:
              type: string
              description: Human-readable message; exact wording is illustrative in the examples.
            attached_obj_type:
              type: string
              enum: [DomainAutoRenewal]
            attached_obj_id:
              type: integer
              description: Internal record ID, distinct from the public cycle UUID.
            attached_obj_data:
              $ref: '#/components/schemas/AutoRenewPollData'

    EppPollRequest:
      type: object
      description: EPP poll command request
      xml:
        name: epp
        namespace: https://epp.tld.ee/schema/epp-ee-1.0.xsd
      properties:
        command:
          type: object
          properties:
            poll:
              type: object
              properties:
                op:
                  type: string
                  enum: [req, ack]
                  xml:
                    attribute: true
                msgID:
                  type: string
                  xml:
                    attribute: true
                  description: Required when op is ack
              required:
                - op
            clTRID:
              type: string
          required:
            - poll
            - clTRID
      required:
        - command

    EppResult:
      type: object
      properties:
        code:
          type: string
          xml:
            attribute: true
        msg:
          type: string

    EppTrID:
      type: object
      properties:
        clTRID:
          type: string
        svTRID:
          type: string

    EppMsgQ:
      type: object
      properties:
        count:
          type: string
          xml:
            attribute: true
        id:
          type: string
          xml:
            attribute: true
        qDate:
          type: string
          format: date-time
        msg:
          type: string

    EppPollEmptyResponse:
      type: object
      description: EPP response when poll queue is empty (result code 1300)
      xml:
        name: epp
        namespace: https://epp.tld.ee/schema/epp-ee-1.0.xsd
      properties:
        response:
          type: object
          properties:
            result:
              $ref: '#/components/schemas/EppResult'
            trID:
              $ref: '#/components/schemas/EppTrID'
          required:
            - result
            - trID
      required:
        - response

    EppPollAckResponse:
      type: object
      description: EPP response for successful poll acknowledge (result code 1000)
      xml:
        name: epp
        namespace: https://epp.tld.ee/schema/epp-ee-1.0.xsd
      properties:
        response:
          type: object
          properties:
            result:
              $ref: '#/components/schemas/EppResult'
            msgQ:
              $ref: '#/components/schemas/EppMsgQ'
            trID:
              $ref: '#/components/schemas/EppTrID'
          required:
            - result
            - trID
      required:
        - response

    EppPollMessageResponse:
      type: object
      description: EPP poll message response (result code 1301)
      xml:
        name: epp
        namespace: https://epp.tld.ee/schema/epp-ee-1.0.xsd
      properties:
        response:
          type: object
          properties:
            result:
              $ref: '#/components/schemas/EppResult'
            msgQ:
              $ref: '#/components/schemas/EppMsgQ'
            resData:
              type: object
              description: Optional response data
            extension:
              type: object
              description: Optional extension data
            trID:
              $ref: '#/components/schemas/EppTrID'
          required:
            - result
            - msgQ
            - trID
      required:
        - response
